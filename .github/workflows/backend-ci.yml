name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: backend

jobs:
  checks:
    name: PHP ${{ matrix.php }} / PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    services:
      postgres:
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_DB: haas_ci_test
          POSTGRES_USER: haas_test
          # Identifiant public de ce service jetable, sans accès extérieur au job.
          POSTGRES_PASSWORD: haas_ci_only
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U haas_test -d haas_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,localhost:8000
      APP_MAINTENANCE_DRIVER: file
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: haas_ci_test
      DB_USERNAME: haas_test
      DB_PASSWORD: haas_ci_only
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer PHP et Composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, mbstring, intl
          coverage: none
          tools: composer:2.10.3

      - name: Installer Node pour les contrôles documentaires
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Installer les dépendances verrouillées
        run: |
          composer validate --strict --no-check-publish
          composer install --prefer-dist --no-interaction --no-progress --no-plugins
          composer check-platform-reqs
          git diff --exit-code -- composer.json composer.lock

      - name: Préparer la configuration de test
        run: |
          cp .env.testing.example .env
          php artisan key:generate --no-interaction

      - name: Vérifier le formatage
        run: composer lint

      - name: Analyser les types PHP
        run: composer analyse

      - name: Tester les unités, HTTP et architecture
        run: composer test

      - name: Tester les migrations et contraintes PostgreSQL
        run: composer test:integration

      - name: Contrôler les dépendances
        run: composer audit --locked --no-interaction

      - name: Vérifier la documentation
        run: |
          php -l ../scripts/ops/exercise-backup.php
          php -l ../scripts/generate-api-types.php
          php ../scripts/generate-api-types.php --check
          node ../scripts/validate-pack.mjs
          node ../scripts/check-deployment-docs.mjs

  backend-ci:
    name: backend-ci
    needs: checks
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    defaults:
      run:
        working-directory: .
    steps:
      - name: Exiger la réussite des deux versions PHP
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success
