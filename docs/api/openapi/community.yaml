            - string
            - 'null'
          maxLength: 3000
        environment:
          type:
            - string
            - 'null'
          maxLength: 255
        code:
          type:
            - string
            - 'null'
          maxLength: 12000
          description: 'Texte inerte, espaces conservés. code_language requis si un code non vide est fourni. Motifs de secrets suspects refusés, sans garantie d’exhaustivité.'
        code_language:
          type:
            - string
            - 'null'
          maxLength: 40
          pattern: '^[a-z0-9][a-z0-9_+.#-]*$'
        primary_language:
          type: string
          maxLength: 35
          pattern: '^[a-zA-Z]{2,3}(?:-[a-zA-Z0-9]{2,8})*$'
          default: fr
        reproduction_url:
          type:
            - string
            - 'null'
          maxLength: 2048
          format: uri
          pattern: '^https://[^/@]+(?:/.*)?$'
        technologies:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/RequestTechnologyInput'
      description: 'Brouillon privé : titre requis, autres contenus facultatifs avec plafonds conservés.'
      allOf:
        -
          if:
            required:
              - code
            properties:
              code:
                type: string
                minLength: 1
          then:
            required:
              - code_language
            properties:
              code_language:
                type: string
                minLength: 1
    HelpRequestPublicationInput:
      type: object
      additionalProperties: false
      required:
