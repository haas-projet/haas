paths:
  /api/v1/notifications:
    get:
      operationId: listOwnNotifications
      summary: Lire ses notifications internes et le compteur non lu
      description: >-
        Session active requise, projection privée no-store. Ordre date/UUID décroissant.
        Aucun courriel, texte de contenu, code, motif de signalement ou lien public retiré.
        Types pris en charge : profile.moderated, comment.created, proposal.created, resolution.accepted, capsule.review.changes_requested et capsule.version.published.
        Pour les commentaires, la visibilité courante du commentaire, de son auteur et du parent
        filtre liste et compteur avant pagination ; aucun extrait n'est exposé.
        Pour les propositions, vérifier aussi le contributeur, le parent et son propriétaire courant
        avant liste, compteur et marquage ; aucun auto-envoi ni extrait de proposition/code.
        Une résolution acceptée notifie le contributeur concerné après commit, sauf auto-résolution,
        avec événement stable par UUID de résolution. Résolution active, parent et proposition actuellement
        visibles et destinataire encore contributeur actif sont vérifiés avant liste, compteur et marquage.
        Aucun contexte déclaré, note de validation, code ou contact n'est copié dans le message.
        Pour les corrections de capsule, le propriétaire courant actif et vérifié et la capsule visible
        filtrent liste, compteur et marquage ; aucun corps ni note de revue n'est exposé.
        Pour les publications, les mêmes droits courants et une version encore published
        sont requis ; le lien désigne cette version précise, jamais une version ultérieure.
      security: [{ SessionCookie: [] }]
      parameters:
        - $ref: '../../OPENAPI.yaml#/components/parameters/Page'
        - $ref: '../../OPENAPI.yaml#/components/parameters/PerPage'
      responses:
        '200':
          description: Boîte du membre courant uniquement
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta, unread_count]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  meta: { $ref: '../../OPENAPI.yaml#/components/schemas/PaginationMeta' }
                  unread_count: { type: integer, minimum: 0 }
        '401': { $ref: './identity.yaml#/components/responses/SessionError' }
        '403': { $ref: './identity.yaml#/components/responses/SessionError' }
        '422': { $ref: './identity.yaml#/components/responses/SessionError' }
  /api/v1/notifications/{id}:
    patch:
      operationId: markOwnNotification
      summary: Marquer sa notification comme lue ou non lue
      description: Session/CSRF, propriétaire actif, relecture sous verrou. Un tiers reçoit 404 même administrateur. Visibilité courante du commentaire, proposition ou résolution active et de leurs auteurs/parent, ou capsule visible et propriétaire actuel actif vérifié, recontrôlée. Une publication exige une version encore published. Notification inaccessible donne 404. Répéter read=true conserve la première date.
      security: [{ SessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: './identity.yaml#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [read]
              properties:
                read: { type: boolean }
      responses:
        '200':
          description: Statut de lecture enregistré
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: './identity.yaml#/components/responses/SessionError' }
        '403': { $ref: './identity.yaml#/components/responses/SessionError' }
        '404': { $ref: './identity.yaml#/components/responses/SessionError' }
        '419': { $ref: './identity.yaml#/components/responses/SessionError' }
        '422': { $ref: './identity.yaml#/components/responses/SessionError' }
        '500': { $ref: './identity.yaml#/components/responses/SessionError' }
components:
  schemas:
    Notification:
      type: object
      additionalProperties: false
      required: [id, kind, message, target_path, read_at, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [profile.moderated, comment.created, proposal.created, resolution.accepted, capsule.review.changes_requested, capsule.version.published] }
        message: { type: string }
        target_path:
          type: string
          pattern: '^/(?:me/profile|requests/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'
          description: Chemin interne /me/profile pour profile.moderated ou /requests/<UUID> pour comment.created/proposal.created/resolution.accepted ; aucune URL externe.
        read_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
