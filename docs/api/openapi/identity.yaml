# Pilote : ousseynoufayeisidk-sys. B05 identité, B06 inscription, B07 sessions.
paths:
  /api/v1/members/{handle}:
    $ref: './profiles.yaml#/paths/~1api~1v1~1members~1{handle}'
  /api/v1/me/profile:
    $ref: './profiles.yaml#/paths/~1api~1v1~1me~1profile'
  /api/v1/technologies:
    $ref: './profiles.yaml#/paths/~1api~1v1~1technologies'
  /api/v1/me:
    $ref: './current-account.yaml#/paths/~1api~1v1~1me'
  /api/v1/account-access:
    $ref: './current-account.yaml#/paths/~1api~1v1~1account-access'
  /forgot-password:
    $ref: './account-mail.yaml#/paths/~1forgot-password'
  /reset-password:
    $ref: './account-mail.yaml#/paths/~1reset-password'
  /email/verification-notification:
    $ref: './account-mail.yaml#/paths/~1email~1verification-notification'
  /email/verify/{id}/{hash}:
    $ref: './account-mail.yaml#/paths/~1email~1verify~1{id}~1{hash}'
  /sanctum/csrf-cookie:
    get:
      operationId: initializeCsrf
      summary: Initialiser la session anonyme et le cookie CSRF
      security: []
      description: >-
        Appeler sur l'origine API avec credentials. Deux cookies Secure en production,
        SameSite=Lax et domaine parent borné ; haas_session est HttpOnly, XSRF-TOKEN est lisible.
        Aucun jeton bearer émis. Réponse privée no-store ; origine étrangère refusée.
      responses:
        '204':
          description: Cookies initialisés, aucun corps JSON.
          headers:
            X-Request-ID:
              $ref: '../../OPENAPI.yaml#/components/headers/RequestId'
        '403':
          $ref: '#/components/responses/SessionError'
  /login:
    post:
      operationId: loginMember
      summary: Ouvrir une session de membre
      description: >-
        Courriel normalisé et mot de passe exact. Rotation de session et du jeton CSRF,
        sans remember-me. Compte non vérifié admis à la connexion, droits métier distincts.
        Cinq tentatives par minute pour courriel/IP normalisés et vingt par IP.
        Bcrypt historique ou identifiants invalides produisent la même erreur 422.
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
                  writeOnly: true
      responses:
        '200':
          description: Session ouverte ; cookies renouvelés, Cache-Control no-store. Aucun courriel ni rôle dans la réponse.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/SessionMember'
        '403':
          $ref: '#/components/responses/SessionError'
        '419':
          $ref: '#/components/responses/SessionError'
        '422':
          $ref: '#/components/responses/SessionError'
        '429':
          $ref: '#/components/responses/SessionError'
        '500':
          $ref: '#/components/responses/SessionError'
  /logout:
    post:
      operationId: logoutMember
      summary: Invalider la session courante
      description: Session SQL détruite, session anonyme et jeton CSRF renouvelés ; anciens cookies inutilisables.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '204':
          description: Déconnexion effectuée, sans corps ; Cache-Control no-store.
        '401':
          $ref: '#/components/responses/SessionError'
        '403':
          $ref: '#/components/responses/SessionError'
        '419':
          $ref: '#/components/responses/SessionError'
  /register:
    post:
      operationId: registerMember
      summary: Inscrire un membre sans le connecter
      description: >-
        Route web protégée par CSRF, JSON en entrée et sortie. Accepter exactement la version
        publiée des conditions configurée sur le serveur. Sans version configurée, erreur 503.
        Limite de cinq tentatives par minute et adresse IP. Aucun courriel envoyé par B06.
        Le parcours SPA avec cookie XSRF et CORS est livré séparément dans B07.
      security: []
      parameters:
        - in: header
          name: X-XSRF-TOKEN
          description: Jeton CSRF issu du cookie de session, requis hors tests ; jamais un bearer token.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMemberInput'
      responses:
        '201':
          description: Membre non vérifié, profil vide et acceptation créés atomiquement ; aucune connexion automatique.
          headers:
            X-Request-ID:
              $ref: '../../OPENAPI.yaml#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
                const: no-store, private
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/RegisteredMember'
        '403':
          $ref: '#/components/responses/RegistrationError'
        '419':
          $ref: '#/components/responses/RegistrationError'
        '422':
          $ref: '#/components/responses/RegistrationError'
        '429':
          $ref: '#/components/responses/RegistrationError'
        '500':
          $ref: '#/components/responses/RegistrationError'
        '503':
          $ref: '#/components/responses/RegistrationError'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: haas_session
      description: Cookie de session chiffré, HttpOnly ; aucun bearer token supporté.
  parameters:
    XsrfToken:
      in: header
      name: X-XSRF-TOKEN
      required: true
      description: Valeur du cookie XSRF-TOKEN après décodage URL, avec cookies de session envoyés.
      schema:
        type: string
  responses:
    SessionError:
      description: >-
        Enveloppe B04 ; 401 sans session, 403 origine ou compte interdit, 419 CSRF invalide,
        422 validation/identifiants, 429 quota, 500 panne. CORS pour les origines autorisées.
      headers:
        X-Request-ID:
          $ref: '../../OPENAPI.yaml#/components/headers/RequestId'
        Retry-After:
          $ref: '../../OPENAPI.yaml#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '../../OPENAPI.yaml#/components/schemas/ApiError'
    RegistrationError:
      description: Erreur du contrat commun ; 422 pour entrée invalide ou doublon, 503 pour conditions indisponibles.
      headers:
        X-Request-ID:
          $ref: '../../OPENAPI.yaml#/components/headers/RequestId'
        Retry-After:
          $ref: '../../OPENAPI.yaml#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '../../OPENAPI.yaml#/components/schemas/ApiError'
  schemas:
    SessionMember:
      type: object
      additionalProperties: false
      required: [id, handle, email_verified]
      properties:
        id:
          type: string
          format: uuid
        handle:
          $ref: '#/components/schemas/Handle'
        email_verified:
          type: boolean
    RegisterMemberInput:
      type: object
      additionalProperties: false
      required: [handle, email, password, password_confirmation, terms_accepted, terms_version]
      properties:
        handle:
          $ref: '#/components/schemas/Handle'
        email:
          type: string
          format: email
          maxLength: 255
          description: Adresse privée, normalisée en minuscules après retrait des espaces périphériques.
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: Longueur Unicode ; espaces conservés ; hash Argon2id sans troncature.
        password_confirmation:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: Identique au mot de passe.
        terms_accepted:
          type: boolean
          const: true
        terms_version:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
          description: Version exacte du texte consulté, égale à REGISTRATION_TERMS_VERSION ; jamais implicite.
    RegisteredMember:
      type: object
      additionalProperties: false
      required: [id, handle, email_verified]
      properties:
        id:
          type: string
          format: uuid
        handle:
          $ref: '#/components/schemas/Handle'
        email_verified:
          type: boolean
          const: false
    AccountRole:
      type: string
      enum: [member, moderator, admin]
      description: Attribut serveur privé ; jamais accepté à l'inscription ni exposé dans un profil public.
    AccountStatus:
      type: string
      enum: [active, suspended]
      description: État administratif privé, distinct de la vérification du courriel.
    Handle:
      type: string
      minLength: 3
      maxLength: 30
      description: Pseudonyme Unicode, sans caractères de contrôle ni espaces périphériques ; unicité sur lower(handle) en PostgreSQL.
    TechnologyId:
      type: string
      format: uuid
      description: Identifiant d'une ligne du référentiel technologies, jamais une enum de langages.
