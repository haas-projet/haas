paths:
  /api/v1/requests:
    get:
      operationId: listHelpRequests
      summary: Rechercher les demandes visibles ou retrouver ses demandes
      description: "Visibilité avant filtres et compteurs. Catalogue public sans brouillons ; scope=mine exige un membre actif vérifié et ne retourne que ses demandes, brouillons compris. Aucun contenu masqué ou auteur inactif/non vérifié. Recherche littérale ILIKE titre/goal/expected/observed/attempts/environment/nom et slug des technologies, jamais code/URL/contributions/identité privée. Filtres cumulés, tri stable avec id croissant en départage. Archives incluses. Paramètres inconnus rejetés, y compris page_size. Cache-Control: no-store. Voir HELP_REQUEST_READING.md."
      security:
        - {}
        - SessionCookie: {}
      parameters:
        - $ref: '../../OPENAPI.yaml#/components/parameters/Page'
        - $ref: '../../OPENAPI.yaml#/components/parameters/PerPage'
        - name: scope
          in: query
          schema:
            type: string
            enum: [public, mine]
            default: public
        - name: q
          in: query
          description: Sous-chaîne littérale, casse ignorée selon la collation PostgreSQL, accents conservés. Vide désactive le filtre.
          schema:
            type: string
            maxLength: 200
        - name: technology
          in: query
          schema:
            type: string
            format: uuid
        - name: state
          in: query
          schema:
            type: string
            enum: [draft, open, in_progress, resolved, archived]
        - name: sort
          in: query
          description: newest/oldest sur created_at, updated sur updated_at ; id croissant en départage.
          schema:
            type: string
            enum: [newest, oldest, updated]
            default: newest
      responses:
        200:
          description: Liste filtrée ; meta.total exclut les contenus inaccessibles. Cache-Control no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpRequestPage'
        401:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        403:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        422:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        500:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        503:
          $ref: '../../OPENAPI.yaml#/components/responses/RetryableFailure'
    post:
      operationId: createHelpRequest
      summary: 'Enregistrer un brouillon privé ou publier une demande'
      description: 'Membre actif et vérifié, session SPA et CSRF requis. mode=draft crée un brouillon ; mode=publish crée une demande open. Aucune transition libre, aucune édition par ce POST. Champs non déclarés (même null) refusés, y compris auteur/état/version/dates et project_id avant BC04. Les contenus et liens sont inertes, aucune récupération réseau. Idempotence 24 h, même acteur/route/clé/charge normalisée : même identifiant et même version, sans doublon ni nouvel audit. Ordre des technologies et casse des UUID ignorés. Droits courants relus avant rejeu ; contenu masqué interdit, version modifiée en conflit. Les brouillons sont privés, même pour un admin. Lectures documentées en B15.'
      security:
        -
          SessionCookie: {  }
      parameters:
        -
          $ref: '../../OPENAPI.yaml#/components/parameters/IdempotencyKey'
        -
          name: X-XSRF-TOKEN
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHelpRequestInput'
      responses:
        201:
          description: 'Demande créée, ou même identifiant/version rejoué. Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpRequestCreated'
        401:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        403:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        404:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        409:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        419:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        422:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        500:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        429:
          $ref: '../../OPENAPI.yaml#/components/responses/RetryableFailure'
        503:
          $ref: '../../OPENAPI.yaml#/components/responses/RetryableFailure'
  /api/v1/requests/{id}:
    patch:
      operationId: updateHelpRequest
      summary: 'Modifier une demande sous version'
      description: 'Auteur actif vérifié seulement, contenu visible non archivé. PATCH partiel, contenu final revalidé sous verrou selon état/intention. Note 20–1000 caractères obligatoire après commentaire/proposition/résolution, même masquée. État/auteur/résolution/projet/champs inconnus interdits, aucun bypass admin. Version périmée 409 sans mutation. Révision, audit sans contenu et idempotence atomiques ; même intention sans nouvelle écriture, ancienne version non rejouée après autre modification. Voir HELP_REQUEST_EDITING.md.'
      security:
        -
          SessionCookie: {  }
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        -
          $ref: '../../OPENAPI.yaml#/components/parameters/IdempotencyKey'
        -
          name: X-XSRF-TOKEN
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HelpRequestUpdateInput'
      responses:
        200:
          description: 'Demande courante et version mise à jour, ou résultat du rejeu autorisé ; Cache-Control no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpRequestDetail'
        401:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        403:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        404:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        409:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        419:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        422:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        429:
          $ref: '../../OPENAPI.yaml#/components/responses/RetryableFailure'
        500:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        503:
          $ref: '../../OPENAPI.yaml#/components/responses/RetryableFailure'
    get:
      operationId: showHelpRequest
      summary: Lire une demande publique ou son propre brouillon
      description: "Auteur actif vérifié et contenu non masqué. Brouillon réservé à son auteur, aucun bypass admin/modérateur. UUID invalide/inconnu, demande cachée ou privée : même 404. Code inerte, aucun chargement d'URL ou de contributions. Cache-Control: no-store."
      security:
        - {}
        - SessionCookie: {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Données autorisées de la demande, même contrat de ressource que B14.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpRequestDetail'
        401:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        403:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        404:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        500:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        503:
          $ref: '../../OPENAPI.yaml#/components/responses/RetryableFailure'
  '/api/v1/requests/{id}/publish':
    post:
      operationId: publishHelpRequest
      summary: 'Publier explicitement un brouillon complet'
      description: 'Auteur actif vérifié, validation complète du brouillon relu sous verrou. Seule transition draft vers open ; version incrémentée, révision publique, audit atomique. Nouvelle intention sur demande déjà publiée = 409. Rejeu autorisé de la même publication = même version. Aucun champ de contenu dans cette commande.'
      security:
        -
          SessionCookie: {  }
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        -
          $ref: '../../OPENAPI.yaml#/components/parameters/IdempotencyKey'
        -
          name: X-XSRF-TOKEN
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HelpRequestPublishInput'
      responses:
        200:
          description: 'Demande courante et version mise à jour, ou résultat du rejeu autorisé ; Cache-Control no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpRequestDetail'
        401:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        403:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        404:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        409:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        419:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        422:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        429:
          $ref: '../../OPENAPI.yaml#/components/responses/RetryableFailure'
        500:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        503:
          $ref: '../../OPENAPI.yaml#/components/responses/RetryableFailure'
  '/api/v1/requests/{id}/revisions':
    get:
      operationId: listHelpRequestRevisions
      summary: 'Lire les notes et champs modifiés accessibles'
      description: 'Visibilité du parent B15. Anciennes révisions de brouillon toujours réservées à son auteur actif vérifié, même après publication. Aucun snapshot de texte/code ni audit technique. Parent masqué, auteur inéligible ou brouillon tiers : 404. Ordre request_version décroissant et total filtré, Cache-Control no-store.'
      security:
        - {  }
        -
          SessionCookie: {  }
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        -
          $ref: '../../OPENAPI.yaml#/components/parameters/Page'
        -
          $ref: '../../OPENAPI.yaml#/components/parameters/PerPage'
      responses:
        200:
          description: 'Historique autorisé paginé.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpRequestRevisionPage'
        401:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        403:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        404:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        422:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        500:
          $ref: '../../OPENAPI.yaml#/components/responses/ApiFailure'
        503:
          $ref: '../../OPENAPI.yaml#/components/responses/RetryableFailure'
components:
  schemas:
    HelpRequestUpdateInput:
      type: object
      additionalProperties: false
      required:
        - lock_version
      anyOf:
        -
          required:
            - help_intent
        -
          required:
            - title
        -
          required:
            - goal
        -
          required:
            - expected
        -
          required:
            - observed
        -
          required:
            - attempts
        -
          required:
            - environment
        -
          required:
            - code
        -
          required:
            - code_language
        -
          required:
            - primary_language
        -
          required:
            - reproduction_url
        -
          required:
            - technologies
      properties:
        lock_version:
          type: integer
          minimum: 1
          maximum: 2147483646
        help_intent:
          type: string
          enum:
            - unblock
            - review_solution
            - reproduce_behavior
            - ask_question
        title:
          type: string
          maxLength: 140
          minLength: 1
        goal:
          type:
            - string
            - 'null'
          maxLength: 2000
          minLength: 1
        expected:
          type:
            - string
            - 'null'
          maxLength: 2000
          minLength: 1
        observed:
          type:
            - string
            - 'null'
          maxLength: 4000
          minLength: 1
        attempts:
          type:
            - string
            - 'null'
          maxLength: 3000
        environment:
          type:
            - string
            - 'null'
          maxLength: 255
        code:
          type:
            - string
            - 'null'
          maxLength: 12000
          description: 'Texte inerte, espaces conservés. code_language requis si un code non vide est fourni. Motifs de secrets suspects refusés, sans garantie d’exhaustivité.'
        code_language:
          type:
            - string
            - 'null'
          maxLength: 40
          pattern: '^[a-z0-9][a-z0-9_+.#-]*$'
        primary_language:
          type: string
          maxLength: 35
          pattern: '^[a-zA-Z]{2,3}(?:-[a-zA-Z0-9]{2,8})*$'
          default: fr
        reproduction_url:
          type:
            - string
            - 'null'
          maxLength: 2048
          format: uri
          pattern: '^https://[^/@]+(?:/.*)?$'
        technologies:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/RequestTechnologyInput'
        edit_note:
          type:
            - string
            - 'null'
          minLength: 20
          maxLength: 1000
          description: 'Note obligatoire après contribution ; reste privée pour une édition de brouillon.'
    HelpRequestPublishInput:
      type: object
      additionalProperties: false
      required:
        - lock_version
      properties:
        lock_version:
          type: integer
          minimum: 1
          maximum: 2147483646
    HelpRequestRevision:
      type: object
      additionalProperties: false
      required:
        - id
        - request_version
        - action
        - changed_fields
        - edit_note
        - occurred_at
      properties:
        id:
          type: string
          format: uuid
        request_version:
          type: integer
          minimum: 1
        action:
          type: string
          enum:
            - updated
            - published
        changed_fields:
          type: array
          items:
            type: string
            enum:
              - help_intent
              - title
              - goal
              - expected
              - observed
              - attempts
              - environment
              - code
              - code_language
              - primary_language
              - reproduction_url
              - technologies
              - state
        edit_note:
          type:
            - string
            - 'null'
          minLength: 20
          maxLength: 1000
        occurred_at:
          type: string
          format: date-time
    HelpRequestRevisionPage:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/HelpRequestRevision'
        meta:
          $ref: '../../OPENAPI.yaml#/components/schemas/PaginationMeta'
    HelpRequestDetail:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/HelpRequest'
    HelpRequestPage:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/HelpRequest'
        meta:
          $ref: '../../OPENAPI.yaml#/components/schemas/PaginationMeta'
    HelpIntent:
      type: string
      enum:
        - unblock
        - review_solution
        - reproduce_behavior
        - ask_question
    RequestTechnologyInput:
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
        version_label:
          type:
            - string
            - 'null'
          maxLength: 40
    HelpRequestDraftInput:
      type: object
      additionalProperties: false
      required:
        - mode
        - help_intent
        - title
      properties:
        mode:
          type: string
          enum:
            - draft
        help_intent:
          type: string
          enum:
            - unblock
            - review_solution
            - reproduce_behavior
            - ask_question
        title:
