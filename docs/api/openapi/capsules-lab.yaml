# Pilote : mdev44-code. Ajouter uniquement les contrats implémentés.
openapi: 3.1.0
info:
  title: HAAS — Capsules et laboratoire
  version: 0.2.0
paths:
  /api/v1/capsules:
    post:
      operationId: storeCapsuleDraft
      summary: Créer un brouillon de capsule
      description: >
        Crée une capsule et sa première version-brouillon. Exactement une des deux
        sources est acceptée (demande résolue XOR origine éditoriale). L'origine
        éditoriale est réservée aux rôles moderator/admin. Compte actif et vérifié
        obligatoire. L'en-tête `Idempotency-Key` est requis. La demande doit être
        réellement resolved, avec résolution active et proposition accepted cohérentes.
        Le rejeu relit les droits et la version ; un brouillon modifié produit 409.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '../../OPENAPI.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapsuleDraftInput'
      responses:
        '201':
          description: Capsule et brouillon créés ; même code pour un rejeu idempotent de la même charge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapsuleDraft'
        '409':
          description: Conflit d'idempotence, slug déjà utilisé ou brouillon modifié depuis sa création
        '403':
          description: Rôle insuffisant, source masquée ou auteur/contributeur non autorisé ; contrôle actuel répété au rejeu
        '422':
          description: Validation ou source non résolue
  /api/v1/capsules/{capsule}/versions:
    post:
      operationId: storeCapsuleVersionDraft
      summary: Créer une nouvelle version-brouillon pour une capsule
      description: >
        Ajoute une version-brouillon à une capsule existante. Réservé au
        propriétaire de la capsule en B23 ; les contributeurs habilités seront
        intégrés par les lots B24/B25. `version_label` MAJOR.MINOR.PATCH unique
        par capsule.
      security:
        - SessionCookie: []
      parameters:
        - name: capsule
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '../../OPENAPI.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapsuleVersionDraftInput'
      responses:
        '201':
          description: Version-brouillon créée ; même code pour un rejeu idempotent de la même charge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapsuleVersionDraft'
        '403':
          description: Non propriétaire
        '404':
          description: Capsule inexistante
        '409':
          description: Conflit d'idempotence ou de version_label
        '422':
          description: Validation
  /api/v1/capsules/{capsule}/versions/{version}:
    patch:
      operationId: updateCapsuleVersionDraft
      summary: Modifier un brouillon de capsule
      description: >
        Édite body/limits/technologies d'une version en état draft ou
        changes_requested. Réservé à l'owner de la capsule ou à un
        contributeur déclaré sur cette version. lock_version obligatoire ;
        périmé = 409 sans mutation. version_label, state, owner, reviewer
        et published_at sont fixés par le serveur et refusés. limits null efface
        les limites déclarées ; un champ absent les conserve. Tous les champs
        inconnus et les technologies inconnues ou dupliquées sont refusés en 422.
      security:
        - SessionCookie: []
      parameters:
        - name: capsule
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: version
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapsuleVersionDraftUpdate'
      responses:
        '200':
          description: Brouillon mis à jour, lock_version incrémenté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapsuleVersionDraft'
        '403':
          description: Non habilité (ni owner, ni contributeur) ou état non éditable
        '404':
          description: Version inexistante ou n'appartenant pas à la capsule
        '409':
          description: lock_version périmé
        '422':
          description: Validation
  /api/v1/capsules/{capsule}/versions/{version}/submit-review:
    post:
      operationId: submitCapsuleVersionForReview
      summary: Soumettre une version-brouillon à la revue
      description: >
        Transition draft → in_review ou changes_requested → in_review. Réservée
        à l'owner ou à un contributeur de la version. Les champs minimum
        (body non vide ≥ 20, limits non vides) sont requis : contenu insuffisant
        produit 422 avec les champs manquants.
        lock_version et Idempotency-Key obligatoires. Le rejeu relit les droits
        actuels et exige la même version en in_review ; toute édition ou décision
        ultérieure produit 409. La soumission ne publie pas la capsule (B25).
      security:
        - SessionCookie: []
      parameters:
        - name: capsule
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: version
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '../../OPENAPI.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapsuleVersionSubmitReviewInput'
      responses:
        '200':
          description: Version soumise à la revue, ou même résultat rejoué sans nouvel audit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapsuleVersionDraft'
        '403':
          description: Non habilité ou état non éligible
        '404':
          description: Version inexistante ou n'appartenant pas à la capsule
        '422':
          description: Validation, champ inconnu ou contenu insuffisant
        '409':
          description: lock_version périmé, état changé ou clé réutilisée avec une autre charge
  /api/v1/admin/capsules/{capsule}/versions/{version}/request-changes:
    post:
      operationId: requestChangesOnCapsuleVersion
      summary: Demander des corrections sur une version en revue
      description: >
        Transition in_review → changes_requested. Réservée aux moderator/admin
        qui ne sont NI owner NI contributeur de la version. Note obligatoire
        entre 20 et 2000 caractères. Renseigne reviewer_id et enregistre la
        note dans capsule_version_reviews avec le lock_version du contenu relu.
        lock_version et Idempotency-Key obligatoires ; champs inconnus refusés.
        Le journal de décisions conserve notes et attributions sans modification
        ni suppression. Cette décision demande une correction ; l'acceptation et
        la publication restent du ressort de B25 avec revue indépendante.
      security:
        - SessionCookie: []
      parameters:
        - name: capsule
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: version
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '../../OPENAPI.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapsuleVersionReviewInput'
      responses:
        '201':
          description: Décision enregistrée, ou même décision rejouée sans doublon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapsuleVersionReview'
        '403':
          description: Auto-revue refusée, rôle insuffisant, ou état non éligible
        '404':
          description: Version inexistante ou n'appartenant pas à la capsule
        '422':
          description: Note hors format, secret indicatif, contrôle interdit ou validation de commande
        '409':
          description: lock_version périmé, état changé ou clé réutilisée avec une autre charge
components:
  schemas:
    CapsuleDraftInput:
      type: object
      additionalProperties: false
      required: [slug, source, version]
      properties:
        slug:
          type: string
          minLength: 3
          maxLength: 120
          pattern: '^[a-z0-9][a-z0-9-]{1,118}[a-z0-9]$'
        source:
          type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind:
              type: string
              enum: [help_request, editorial]
            help_request_id:
              type: string
              format: uuid
              nullable: true
            editorial_origin:
              type: string
              minLength: 3
              maxLength: 100
              nullable: true
        version:
          $ref: '#/components/schemas/CapsuleVersionDraftInput'
    CapsuleVersionDraftInput:
      type: object
      additionalProperties: false
      required: [version_label, body]
      properties:
        version_label:
          type: string
          pattern: '^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$'
          maxLength: 40
        body:
          type: string
          minLength: 20
          maxLength: 24000
          description: Au moins 20 caractères après retrait des espaces extérieurs pour la validation ; le corps valide est conservé exactement.
        limits:
          type: string
          minLength: 1
          maxLength: 4000
          nullable: true
        technologies:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [technology_id]
            properties:
              technology_id:
                type: string
                format: uuid
              version_label:
                type: string
                maxLength: 40
                nullable: true
    CapsuleDraft:
      type: object
      required: [id, slug, visibility, source, version]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        visibility: { type: string, enum: [visible, hidden] }
        source:
          type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [help_request, editorial] }
            help_request_id: { type: string, format: uuid, nullable: true }
            editorial_origin: { type: string, nullable: true }
        version:
          $ref: '#/components/schemas/CapsuleVersionDraft'
    CapsuleVersionDraft:
      type: object
      required: [id, capsule_id, version_label, state, body, limits, lock_version, technologies]
      properties:
        id: { type: string, format: uuid }
        capsule_id: { type: string, format: uuid }
        version_label: { type: string }
        state: { type: string, enum: [draft, in_review, changes_requested, published, withdrawn] }
        body: { type: string }
        limits: { type: string, nullable: true }
        lock_version: { type: integer, minimum: 1 }
        technologies:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              slug: { type: string }
              version_label: { type: string, nullable: true }
    CapsuleVersionReviewInput:
      type: object
      additionalProperties: false
      required: [lock_version, note]
      properties:
        lock_version: { type: integer, minimum: 1, maximum: 2147483646 }
        note:
          type: string
          minLength: 20
          maxLength: 2000
    CapsuleVersionReview:
      type: object
      required: [id, version_id, reviewed_lock_version, decision, note]
      properties:
        id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        reviewed_lock_version: { type: integer, minimum: 1, nullable: true, description: 'Version relue ; null uniquement pour le journal antérieur à cette migration, sans attribution inventée.' }
        decision: { type: string, enum: [request_changes] }
        note: { type: string }
        created_at: { type: string, format: date-time, nullable: true }
    CapsuleVersionSubmitReviewInput:
      type: object
      additionalProperties: false
      required: [lock_version]
      properties:
        lock_version: { type: integer, minimum: 1, maximum: 2147483646 }
    CapsuleVersionDraftUpdate:
      type: object
      additionalProperties: false
      required: [lock_version]
      properties:
        lock_version:
          type: integer
          minimum: 1
          maximum: 2147483646
          description: Entier JSON strict ; les chaînes numériques sont refusées.
        body:
          type: string
          minLength: 20
          maxLength: 24000
          description: Au moins 20 caractères après retrait des espaces extérieurs pour la validation ; le corps valide est conservé exactement.
        limits:
          type: string
          minLength: 1
          maxLength: 4000
          nullable: true
        technologies:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [technology_id]
            properties:
              technology_id: { type: string, format: uuid }
              version_label: { type: string, maxLength: 40, nullable: true }
