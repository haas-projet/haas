# Pilote : mdev44-code. Profils et comparaisons B1 (BV204 à BV208).
openapi: 3.1.0
info:
  title: HAAS — Comparaisons B1
  version: 0.4.0
paths:
  '/api/v1/versions/{id}/comparison-profiles':
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listComparisonProfilesForVersion
      summary: Lister les profils de comparaison approuvés d'une version publiée
      description: >
        Liste des profils B1 approuvés attachés à la version publiée visible,
        enabled uniquement. Aucun digest interne, aucun chemin, aucun manifeste
        n'est exposé. Les profils sont déclarés par la commande interne
        lab:bind-comparison-profile ; aucune route publique n'écrit, n'active
        ni ne retire un profil. Réponse Cache-Control no-store, private.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Liste (éventuellement vide) de profils compatibles
          headers:
            Cache-Control:
              description: 'no-store, private'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonProfileList'
        '401':
          description: Session absente ou expirée
        '403':
          description: Compte non vérifié ou suspendu
        '404':
          description: Version inconnue, non publiée, retirée, ou capsule masquée
  '/api/v1/comparisons':
    post:
      operationId: startComparison
      summary: Démarrer une comparaison B1 (202 + suivi)
      description: >
        BV206 — réserve atomiquement un emplacement global (partagé avec le
        lanceur simple) et deux unités du quota horaire du membre, puis crée
        la comparaison et ses deux enfants lab_runs (baseline, candidate)
        tous en state queued. En-tête `Idempotency-Key` obligatoire : même
        clé + même charge = rejeu (202, même id) ; autre charge = 409. Aucun
        champ exécutable (code, command, url, path, scénario dynamique) n'est
        accepté. Switch laboratoire fermé = 503. Capacité pleine ou quota
        horaire dépassé = 429 avec `Retry-After`. Aucune mutation publique
        n'écrit outcome, input_digest, seed, env_snapshot ou digests des
        enfants ; BV208 ouvrira la révélation contrôlée de l'outcome.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '../../OPENAPI.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [comparison_profile_id, scenario_key]
              properties:
                comparison_profile_id:
                  type: string
                  format: uuid
                scenario_key:
                  type: string
                  enum: ['nominal_event', 'duplicate_event', 'distinct_events', 'invalid_event']
            examples:
              nominal:
                summary: Exemple fictif — Idempotency-Key requis en en-tête
                value:
                  comparison_profile_id: 'uuid-du-profil-approuve'
                  scenario_key: 'duplicate_event'
      responses:
        '202':
          description: Comparaison acceptée en queued ; deux enfants réservés
          headers:
            Cache-Control:
              description: 'no-store, private'
              schema:
                type: string
            Location:
              description: URL de suivi de la comparaison
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonRunEnvelope'
        '401':
          description: Session absente ou expirée
        '403':
          description: Compte non vérifié ou suspendu
        '404':
          description: Profil inconnu, disabled ou version candidate non publiée/retirée
        '409':
          description: Même Idempotency-Key avec une charge différente
        '422':
          description: Validation (clé manquante, UUID invalide, champ exécutable rejeté)
        '429':
          description: Capacité pleine ou quota horaire dépassé (Retry-After présent)
          headers:
            Retry-After:
              $ref: '../../OPENAPI.yaml#/components/headers/RetryAfter'
        '503':
          description: Switch laboratoire fermé
  '/api/v1/comparisons/{id}':
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: showComparisonRun
      summary: Lire une comparaison appartenant à l'acteur authentifié
      description: >
        Projection publique BV205 : jamais l'outcome machine, le digest
        d'entrée, le seed, l'env_snapshot ou les digests des enfants. Un
        acteur ne lit que ses propres comparaisons ; toute autre id (y
        compris celle d'autrui) renvoie 404. BV206 ouvrira POST
        /comparisons avec Idempotency-Key ; BV208 fera la révélation
        contrôlée de l'outcome.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Projection de la comparaison et URLs de suivi des deux enfants
          headers:
            Cache-Control:
              description: 'no-store, private'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonRunEnvelope'
        '401':
          description: Session absente ou expirée
        '403':
          description: Compte non vérifié ou suspendu
        '404':
          description: Comparaison inconnue ou appartenant à un autre acteur
        '422':
          description: Un paramètre de requête a été envoyé (la lecture n'en accepte aucun)
components:
  schemas:
    ComparisonFamilyKey:
      type: string
      enum: ['b1.idempotent.v1']
    ComparisonProfile:
      type: object
      additionalProperties: false
      required: [id, family_key, candidate_version_id, input_schema_version, enabled, allowed_scenarios]
      properties:
        id:
          type: string
          format: uuid
        family_key:
          $ref: '#/components/schemas/ComparisonFamilyKey'
        candidate_version_id:
          type: string
          format: uuid
        input_schema_version:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
        enabled:
          type: boolean
        allowed_scenarios:
          type: array
          minItems: 1
          items:
            type: string
            enum: ['nominal_event', 'duplicate_event', 'distinct_events', 'invalid_event']
    ComparisonProfileList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ComparisonProfile'
    ComparisonState:
      type: string
      enum: ['queued', 'running', 'completed', 'error', 'timed_out']
    ComparisonOutcome:
      type: string
      enum: ['improved', 'unchanged', 'regressed', 'mixed', 'inconclusive']
    ComparisonRun:
      type: object
      additionalProperties: false
      required: [id, profile_id, state, outcome, created_at, started_at, finished_at, follow_url, children_follow_urls]
      properties:
        id:
          type: string
          format: uuid
        profile_id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/ComparisonState'
        outcome:
          description: >
            BV208 — Conclusion dérivée exposée à l'acteur propriétaire. Jamais
            d'assertions, de runtime ou de digest brut. Null pour queued et
            running ; completed renvoie la conclusion persistée (y compris
            inconclusive si les identifiants d'assertion diffèrent) ; error
            et timed_out renvoient inconclusive dérivé à la lecture alors
            que la colonne reste NULL (CHECK
            comparison_runs_outcome_requires_terminal).
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ComparisonOutcome'
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, 'null']
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
        follow_url:
          type: string
          pattern: '^/api/v1/comparisons/[0-9a-f-]{36}$'
        children_follow_urls:
          type: array
          minItems: 0
          maxItems: 2
          items:
            type: string
            pattern: '^/api/v1/lab-runs/[0-9a-f-]{36}$'
    ComparisonRunEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ComparisonRun'
