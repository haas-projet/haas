            ],
            "minLength": 3,
            "maxLength": 80
          },
          "summary": {
            "type": [
              "string",
              "null"
            ],
            "minLength": 30,
            "maxLength": 240
          },
          "description": {
            "type": [
              "string",
              "null"
            ],
            "minLength": 80,
            "maxLength": 4000
          },
          "project_stage": {
            "type": "string",
            "enum": [
              "idea",
              "prototype",
