            "items": {
              "type": "string",
              "format": "uuid"
            }
          }
        }
      },
      "Project": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "owner",
          "name",
          "summary",
          "description",
          "project_stage",
          "publication_state",
          "help_sought",
          "demo_url",
          "repository_url",
          "lock_version",
          "published_at",
          "technologies",
          "created_at",
          "updated_at"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "owner": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "id",
              "handle"
            ],
            "properties": {
              "id": {
                "type": "string",
                "format": "uuid"
              },
              "handle": {
                "$ref": "./identity.yaml#/components/schemas/Handle"
              }
            }
          },
          "name": {
            "type": [
