openapi: 3.1.0
info:
  title: HAAS — Socle API
  version: 0.16.0
  description: Socle identité, profils, audit et idempotence ; création B14, lecture B15, édition/publication/historique B16 ; commentaires historisés et notifications internes B17 ; autres contributions à raccorder.
servers:
  - url: http://localhost:8000
x-haas-domain-fragments:
  identity:
    $ref: './api/openapi/identity.yaml'
  community:
    $ref: './api/openapi/community.yaml'
  capsules-lab:
    $ref: './api/openapi/capsules-lab.yaml'
paths:
  '/api/v1/requests/{id}/comments':
    $ref: './api/openapi/community.yaml#/paths/~1api~1v1~1requests~1{id}~1comments'
  '/api/v1/comments/{id}':
    $ref: './api/openapi/community.yaml#/paths/~1api~1v1~1comments~1{id}'
  '/api/v1/comments/{id}/revisions':
    $ref: './api/openapi/community.yaml#/paths/~1api~1v1~1comments~1{id}~1revisions'
  '/api/v1/requests/{id}/publish':
    $ref: './api/openapi/community.yaml#/paths/~1api~1v1~1requests~1{id}~1publish'
  '/api/v1/requests/{id}/revisions':
    $ref: './api/openapi/community.yaml#/paths/~1api~1v1~1requests~1{id}~1revisions'
  /api/v1/requests:
    $ref: './api/openapi/community.yaml#/paths/~1api~1v1~1requests'
  /api/v1/requests/{id}:
    $ref: './api/openapi/community.yaml#/paths/~1api~1v1~1requests~1{id}'
  /api/v1/reports:
    $ref: './api/openapi/moderation.yaml#/paths/~1api~1v1~1reports'
  /api/v1/admin/reports:
    $ref: './api/openapi/moderation.yaml#/paths/~1api~1v1~1admin~1reports'
  /api/v1/admin/reports/{id}:
    $ref: './api/openapi/moderation.yaml#/paths/~1api~1v1~1admin~1reports~1{id}'
  /api/v1/admin/reports/{id}/decisions:
    $ref: './api/openapi/moderation.yaml#/paths/~1api~1v1~1admin~1reports~1{id}~1decisions'
  /api/v1/notifications:
    $ref: './api/openapi/notifications.yaml#/paths/~1api~1v1~1notifications'
  /api/v1/notifications/{id}:
    $ref: './api/openapi/notifications.yaml#/paths/~1api~1v1~1notifications~1{id}'
  /api/v1/admin/members:
    $ref: './api/openapi/administration.yaml#/paths/~1api~1v1~1admin~1members'
  /api/v1/admin/members/{id}:
    $ref: './api/openapi/administration.yaml#/paths/~1api~1v1~1admin~1members~1{id}'
  /api/v1/capsules:
    $ref: './api/openapi/capsules-lab.yaml#/paths/~1api~1v1~1capsules'
  /api/v1/capsules/{slug}:
    $ref: './api/openapi/capsules-lab.yaml#/paths/~1api~1v1~1capsules~1{slug}'
  /api/v1/capsules/{slug}/versions/{version}:
    $ref: './api/openapi/capsules-lab.yaml#/paths/~1api~1v1~1capsules~1{slug}~1versions~1{version}'
  /api/v1/capsules/{capsule}/versions:
    $ref: './api/openapi/capsules-lab.yaml#/paths/~1api~1v1~1capsules~1{capsule}~1versions'
  /api/v1/capsules/{capsule}/versions/{version}:
    $ref: './api/openapi/capsules-lab.yaml#/paths/~1api~1v1~1capsules~1{capsule}~1versions~1{version}'
  /api/v1/capsules/{capsule}/versions/{version}/submit-review:
    $ref: './api/openapi/capsules-lab.yaml#/paths/~1api~1v1~1capsules~1{capsule}~1versions~1{version}~1submit-review'
  /api/v1/admin/capsules/{capsule}/versions/{version}/request-changes:
    $ref: './api/openapi/capsules-lab.yaml#/paths/~1api~1v1~1admin~1capsules~1{capsule}~1versions~1{version}~1request-changes'
  /api/v1/admin/capsules/{capsule}/versions/{version}/publish:
    $ref: './api/openapi/capsules-lab.yaml#/paths/~1api~1v1~1admin~1capsules~1{capsule}~1versions~1{version}~1publish'
  /api/v1/capsules/{capsule}/versions/{version}/artifact/{artifact}:
    $ref: './api/openapi/capsules-lab.yaml#/paths/~1api~1v1~1capsules~1{capsule}~1versions~1{version}~1artifact~1{artifact}'
  /api/v1/capsules/{capsule}/versions/{version}/artifact/{artifact}/stream:
    $ref: './api/openapi/capsules-lab.yaml#/paths/~1api~1v1~1capsules~1{capsule}~1versions~1{version}~1artifact~1{artifact}~1stream'
  /api/v1/members/{handle}:
    $ref: './api/openapi/identity.yaml#/paths/~1api~1v1~1members~1{handle}'
  /api/v1/me/profile:
    $ref: './api/openapi/identity.yaml#/paths/~1api~1v1~1me~1profile'
  /api/v1/technologies:
    $ref: './api/openapi/identity.yaml#/paths/~1api~1v1~1technologies'
  /api/v1/me:
    $ref: './api/openapi/identity.yaml#/paths/~1api~1v1~1me'
  /api/v1/account-access:
    $ref: './api/openapi/identity.yaml#/paths/~1api~1v1~1account-access'
  /forgot-password:
    $ref: './api/openapi/identity.yaml#/paths/~1forgot-password'
  /reset-password:
    $ref: './api/openapi/identity.yaml#/paths/~1reset-password'
  /email/verification-notification:
    $ref: './api/openapi/identity.yaml#/paths/~1email~1verification-notification'
  /email/verify/{id}/{hash}:
    $ref: './api/openapi/identity.yaml#/paths/~1email~1verify~1{id}~1{hash}'
  /sanctum/csrf-cookie:
    $ref: './api/openapi/identity.yaml#/paths/~1sanctum~1csrf-cookie'
  /login:
    $ref: './api/openapi/identity.yaml#/paths/~1login'
  /logout:
    $ref: './api/openapi/identity.yaml#/paths/~1logout'
  /register:
    $ref: './api/openapi/identity.yaml#/paths/~1register'
  /up:
    get:
      operationId: getHealth
      summary: Vérifier le démarrage de l'application
      description: Sonde sans accès SQL ; ne certifie pas la disponibilité des services externes.
      security: []
      responses:
        '200':
          description: Application démarrée
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
components:
  securitySchemes:
    SessionCookie:
      $ref: './api/openapi/identity.yaml#/components/securitySchemes/SessionCookie'
  headers:
    RequestId:
      description: UUID généré par le serveur pour chaque requête ; un identifiant fourni par le client est ignoré.
      schema:
        type: string
        format: uuid
    RetryAfter:
      description: Délai en secondes ou date HTTP si le serveur dispose de cette information. Aucune mutation rejouée automatiquement.
      schema:
        type: string
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID v4 créé par intention et conservé pour ses relances pendant 24 h. Les droits sont revérifiés au rejeu ; une autre charge avec la même clé donne 409 IDEMPOTENCY_CONFLICT.
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  schemas:
    IdempotencyKey:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
      example: fda9a000-3333-4444-8888-123456789abc
    AccountRole:
      $ref: './api/openapi/identity.yaml#/components/schemas/AccountRole'
    AccountStatus:
      $ref: './api/openapi/identity.yaml#/components/schemas/AccountStatus'
    Handle:
      $ref: './api/openapi/identity.yaml#/components/schemas/Handle'
    TechnologyId:
      $ref: './api/openapi/identity.yaml#/components/schemas/TechnologyId'
    ApiError:
      type: object
      additionalProperties: false
      required: [error, request_id]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, fields]
          properties:
            code:
              type: string
              description: Code stable commun ou code métier documenté par le domaine ; jamais une classe PHP.
              pattern: '^[A-Z][A-Z0-9_]+$'
            message:
              type: string
              description: Message public en français ; aucune trace ni information interne.
            fields:
              type: object
              description: Erreurs par champ ; objet vide hors validation. Les clés imbriquées utilisent la notation pointée.
              additionalProperties:
                type: array
                items:
                  type: string
        request_id:
          type: string
          format: uuid
          description: Identique à X-Request-ID, utile pour retrouver une panne journalisée.
    PaginationMeta:
      type: object
      additionalProperties: false
      required: [current_page, per_page, last_page, total, from, to]
      properties:
        current_page:
          type: integer
          minimum: 1
          maximum: 2147483647
        per_page:
          type: integer
          minimum: 1
          maximum: 50
        last_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        from:
          type: [integer, 'null']
          minimum: 1
        to:
          type: [integer, 'null']
          minimum: 1
    PaginatedResult:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          description: Chaque endpoint doit préciser sa Resource dans items ; ce schéma est le socle commun.
          items:
            type: object
        meta:
          $ref: '#/components/schemas/PaginationMeta'
  responses:
    ApiFailure:
      description: Erreur HAAS. Voir le tableau de codes communs dans HTTP_CONTRACT.md.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RetryableFailure:
      description: Erreur 429 ou 503 ; Retry-After conservé lorsqu'il est disponible.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
